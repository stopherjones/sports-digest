name: Weekly Sports Digest Email

on:
  schedule:
    - cron: '0 11 * * 1' # Runs every Monday at 11:00 AM UTC
  workflow_dispatch:     # Allows manual trigger from GitHub Actions tab

jobs:
  send-weekly-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest Teams Data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-teams.mjs

      - name: Generate Weekly Digest Email
        id: generate_digest
        run: node scripts/generate-digest-email.mjs

      - name: Send Digest Email via SMTP
        if: ${{ secrets.MAIL_USERNAME != '' || secrets.SMTP_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_SERVER || secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || secrets.SMTP_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME || secrets.SMTP_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD || secrets.SMTP_PASSWORD }}
          subject: "🏆 Weekly Sports Summary"
          to: ${{ secrets.MAIL_TO || secrets.NOTIFICATION_EMAIL || 'chrisjones59@gmail.com' }}
          from: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME || secrets.SMTP_USERNAME || 'Sports Digest <noreply@sports-digest.com>' }}
          html_body: file://digest-email.html
