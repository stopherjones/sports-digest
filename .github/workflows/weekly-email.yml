name: Weekly Sports Digest Email

on:
  schedule:
    - cron: '0 10 * * 1' # Runs every Monday at 10:00 AM UTC
  workflow_dispatch:     # Allows manual trigger from GitHub Actions tab

jobs:
  send-weekly-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private data repository (if configured)
        if: ${{ env.DATA_REPO != '' && env.DATA_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ env.DATA_REPO_TOKEN }}
          path: data-repo
        continue-on-error: true
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN || secrets.PRIVATE_DATA_PAT || secrets.DATA_REPO_PAT || secrets.GH_PAT || secrets.PAT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Weekly Digest Email
        id: generate_digest
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN || secrets.PRIVATE_DATA_PAT || secrets.DATA_REPO_PAT || secrets.GH_PAT || secrets.PAT_TOKEN }}
          DATA_JSON_URL: ${{ secrets.DATA_JSON_URL }}
          DATA_FILE_PATH: ${{ secrets.DATA_FILE_PATH || 'data-repo/data.json' }}
          TEAMS_DATA_URL: ${{ secrets.TEAMS_DATA_URL }}
        run: node scripts/generate-digest-email.mjs

      - name: Send Digest Email via SMTP
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.MAIL_SERVER || secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || secrets.SMTP_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.generate_digest.outputs.subject || '🏆 Weekly Sports Summary' }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
          html_body: file://digest-email.html
